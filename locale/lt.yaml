    description: Perkelia komandą „Susieti ir atidaryti“ į sąrašo viršų
  updatedLinkStructure:
    name: Išlaikyti nuorodos tekstą
    description: Įjungus, konvertuojant Biblijos tekstą bus išlaikytas dabartinis nuorodos tekstas
    keepCurrentStructure: Išlaikyti dabartinę struktūrą
    usePluginSettings: Naudoti papildinio nustatymus
  noLanguageParameter:
    name: Kurti nuorodas be kalbos
    description: Įjungus, prie nuorodos nepridedamas kalbos parametras. Nuorodos atsidarys JW Library nustatyta kalba
  reconvertExistingLinks:
    name: Iš naujo konvertuoti esamas nuorodas
    description: Įjungus, jau konvertuotos jwlibrary:// nuorodos bus konvertuojamos iš naujo pagal dabartinius formatavimo nustatymus. Taip visas nuorodas galite suderinti su naujausiais nustatymais.
