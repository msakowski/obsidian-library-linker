    description: Pasirinkite nuorodos teksto ilgį
    short: Trumpas
    medium: Vidutinis
    long: Ilgas
  linkStyling:
    name: Nuorodos stilius
    description: Pasirinkite simbolius ar jaustukus, pridedamus prieš nuorodą, po jos arba jos viduje, ir šrifto stilių
    reset: 'Atkurti numatytąjį: „{{default}}“'
    prefixOutsideLink:
      name: Priešdėlis už nuorodos
      description: Tekstas, pridedamas prieš nuorodą
    prefixInsideLink:
      name: Priešdėlis nuorodoje
      description: Tekstas, pridedamas nuorodos teksto pradžioje
    suffixInsideLink:
      name: Priesaga nuorodoje
      description: Tekstas, pridedamas nuorodos teksto pabaigoje
    suffixOutsideLink:
      name: Priesaga už nuorodos
      description: Tekstas, pridedamas po nuorodos
    presets:
      name: Stiliaus šablonai
      description: Pasirinkite nuorodos stiliaus šabloną
    fontStyle:
      name: Šrifto stilius
      description: Pasirinkite nuorodos teksto šrifto stilių
      normal: Įprastas
      italic: Pasvirasis
      bold: Paryškintas
    preview:
      name: Nuorodos peržiūra
  bibleQuote:
    includeVerseNumbers:
      name: Įtraukti eilučių numerius
      description: Rodyti eilučių numerius kelių eilučių citatose. Vienos eilutės citatos lieka be numerio.
    name: Biblijos citatų formatavimas
    description: Nustatykite, kaip formatuojamos įterpiamos Biblijos citatos
    presets:
      name: Šablonai
      short: Nuoroda + citata
      plain: Nuoroda citatoje
      foldable: Suskleidžiamas paaiškinimo blokas (callout)
      expanded: Išskleistas paaiškinimo blokas (callout)
    template:
      name: Citatos šablonas
      description: 'Pritaikykite citatos formatą naudodami kintamuosius: {bibleRef}, {bibleRefLinked}, {quote}'
    preview:
      name: Biblijos citatos peržiūra
  offlineBible:
    name: Biblija be interneto
    description: Vieną kartą importuokite Biblijos EPUB failą ir naudokite vietinius skyrių duomenis citatoms be interneto.
    allowOnlineFallback:
      name: Leisti atsarginį gavimą internetu
      description: Jei vietinių duomenų nėra, leisti papildiniui bandyti gauti citatą internetu.
    installedList:
      name: Įdiegtos Biblijos be interneto
      description: Kiekvienai kalbai galima įdiegti vieną Bibliją. Kalba nustatoma pagal EPUB metaduomenis.
      empty: Dar neįdiegta nė viena Biblija be interneto.
      entry: '{{sourceFileName}} — skyrių: {{chapterCount}}, importuota {{importedAt}}'
    actions:
      name: Biblijos be interneto veiksmai
      description: Importuokite EPUB failą, kad pridėtumėte naują kalbą. Norėdami pakeisti esamą, pirmiausia ją pašalinkite.
      import: Importuoti Biblijos EPUB
      importing: Importuojama...
      openFolder: Atidaryti Biblijos be interneto aplanką
