    name: Offline Biblia
    description: Importálj egyszer egy Biblia EPUB-fájlt, és használd a helyi fejezetadatokat offline idézetkereséshez.
    enabled:
      name: Offline Biblia engedélyezése
      description: Engedélyezi, hogy az idézetkeresés az importált helyi bibliai adatokat használja.
    preferOffline:
      name: Offline idézetek előnyben részesítése
      description: Először az importált offline Bibliát ellenőrzi, mielőtt online kérést indít.
    allowOnlineFallback:
      name: Online tartalék engedélyezése
      description: Ha az offline adatok hiányoznak, a plugin megpróbálhatja az online idézetszolgáltatót.
    installedList:
      name: Telepített offline Bibliák
      description: Nyelvenként egy offline Biblia telepíthető. A nyelv az EPUB metaadataiból derül ki.
      empty: Még nincs telepített offline Biblia.
      entry: '{{sourceFileName}} — {{chapterCount}} fejezet, importálva: {{importedAt}}'
    actions:
      name: Offline Biblia műveletei
      description: Importálj egy EPUB-fájlt új nyelv hozzáadásához. Meglévő lecseréléséhez először távolítsd el.
