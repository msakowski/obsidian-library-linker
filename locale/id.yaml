settings:
  language:
    name: Bahasa
    description: Pilih Bahasa yang akan digunakan untuk referensi Alkitab
  openAutomatically:
    name: Buka tautan secara otomatis
    description: Pindahkan perintah "Tautkan dan Buka" ke posisi paling atas di dalam daftar perintah
  updatedLinkStructure:
    name: Pertahankan teks tautan
    description: Saat diaktifkan, teks tautan yang dikonversikan menjadi teks Alkitab akan dibiarkan sediakala
    keepCurrentStructure: Pertahankan struktur tautan yang sekarang
    usePluginSettings: Gunakan pengaturan plugin
  noLanguageParameter:
    name: Buat tautan tidak bergantung pada bahasa
    description: Saat diaktifkan, parameter bahasa tidak akan ditambahkan ke dalam tautan. Tautan akan dibuka dalam bahasa JW Library
  reconvertExistingLinks:
    name: Konversi kembali tautan yang ada
    description: Saat diaktifkan, tautan jwlibrary:// yang sudah terkonversi akan dikonversikan ulang sesuai dengan pengaturan format tautan anda sekarang. Ini memperbolehkan anda untuk memperbarui semua tautan yang ada agar sesuai dengan pengaturan terbaru anda.
  bookLength:
    name: Panjang teks tautan
    description: Pilih panjang text tautan
    short: Pendek
    medium: Sedang
    long: Panjang
  linkStyling:
    name: Tampilan tautan
    description: Pilih karakter atau emoji untuk ditambahkan sebelum, sesudah atau di dalam tautan, atur tampilan font
    reset: 'Kembalikan ke semula: "{{default}}"'
    prefixOutsideLink:
      name: Awalan di luar tautan
      description: Teks yang ditambahkan sebelum tautan
    prefixInsideLink:
      name: Awalan di dalam tautan
      description: Teks yang ditambahkan di awal teks tautan
    suffixInsideLink:
      name: Akhiran di dalam tautan
      description: Teks yang ditambahkan di akhir teks tautan
    suffixOutsideLink:
      name: Akhiran di luar tautan
      description: Teks yang ditambahkan setelah tautan
    presets:
      name: Preset tampilan
      description: Pilih preset untuk tampilan tautan
    fontStyle:
      name: Tampilan font
      description: Pilih tampilan font untuk teks tautan
      normal: Normal
      italic: Cetak Miring
      bold: Cetak Tebal
    preview:
      name: Pratinjau tautan
  bibleQuote:
    name: Format kutipan Alkitab
    description: Atur bagaimana kutipan Alkitab diformat ketika dimasukkan
    presets:
      name: Preset template
      short: Tautan + Kutipan
      plain: Tautan dalam kutipan
      foldable: Catatan Lipat
      expanded: Catatan yang Diperluas
    template:
      name: Template kutipan
      description: 'Sesuaikan format kutipan menggunakan variabel: {bibleRef}, {bibleRefLinked}, {quote}'
    preview:
      name: Pratinjau kutipan Alkitab
  offlineBible:
    name: Alkitab offline
    description: Impor EPUB Alkitab dan gunakan data lokal untuk pencarian kutipan offline.
    enabled:
      name: Aktifkan Alkitab offline
      description: Izinkan alur kerja kutipan untuk menggunakan data Alkitab lokal yang telah diimpor.
    preferOffline:
      name: Utamakan kutipan offline
      description: Cek Alkitab offline terimpor sebelum mencoba untuk mengambil kutipan secara online.
    allowOnlineFallback:
      name: Gunakan Pengalihan Online
      description: Jika data offline tidak ada, izinkan plugin ini untuk mencoba menggunakan provider kutipan online
    installedList:
      name: Alkitab offline terinstal
      description: Satu Alkitab offline dapat diinstal untuk setiap bahasa. Bahasa dideteksi dari metadata EPUB.
      empty: Belum ada Alkitab offline yang terinstal.
      entry: '{{sourceFileName}} — {{chapterCount}} pasal, diimpor {{importedAt}}'
    actions:
      name: Tindakan Alkitab offline
      description: Impor EPUB untuk menambahkan bahasa baru. Untuk mengganti bahasa yang sudah ada, silakan hapus bahasa yang sudah ada terlebih dahulu.
      import: Impor EPUB Alkitab
      importing: Mengimpor...
      openFolder: Buka folder Alkitab offline
