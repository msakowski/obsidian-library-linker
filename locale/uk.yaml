settings:
  language:
    name: Мова
    description: Виберіть мову для біблійних посилань
  openAutomatically:
    name: Відкривати посилання автоматично
    description: Переміщує команду «Створити посилання й відкрити» на початок списку
  updatedLinkStructure:
    name: Зберігати текст посилання
    description: Якщо увімкнено, поточний текст посилання зберігається під час конвертації біблійного тексту
    keepCurrentStructure: Зберегти поточну структуру
    usePluginSettings: Використовувати налаштування плагіна
  noLanguageParameter:
    name: Створювати посилання незалежно від мови
    description: Якщо увімкнено, параметр мови не додається до посилання. Посилання відкриватимуться мовою JW Library
  reconvertExistingLinks:
    name: Переконвертувати наявні посилання
    description: Якщо увімкнено, уже сконвертовані посилання jwlibrary:// буде переконвертовано згідно з поточними налаштуваннями форматування. Це дає змогу оновити всі посилання відповідно до останніх уподобань.
  bookLength:
    name: Довжина тексту посилання
    description: Виберіть довжину тексту посилання
    short: Коротка
    medium: Середня
    long: Довга
  linkStyling:
    name: Стиль посилання
    description: Виберіть символи або емодзі, які додаються до, після або всередині посилання; виберіть стиль шрифту
    reset: 'Скинути до типового: "{{default}}"'
    prefixOutsideLink:
      name: Префікс ззовні посилання
      description: Текст, що додається перед посиланням
    prefixInsideLink:
      name: Префікс усередині посилання
      description: Текст, що додається на початок тексту посилання
    suffixInsideLink:
      name: Суфікс усередині посилання
      description: Текст, що додається в кінець тексту посилання
    suffixOutsideLink:
      name: Суфікс ззовні посилання
      description: Текст, що додається після посилання
    presets:
      name: Готові стилі
      description: Виберіть готовий стиль для посилання
    fontStyle:
      name: Стиль шрифту
      description: Виберіть стиль шрифту для тексту посилання
      normal: Звичайний
      italic: Курсив
      bold: Жирний
    preview:
      name: Попередній перегляд посилання
  bibleQuote:
    name: Форматування біблійної цитати
    description: Налаштуйте формат біблійних цитат під час вставлення
    presets:
      name: Шаблони
      short: Посилання + цитата
      plain: Посилання в цитаті
      foldable: Згортуваний блок
      expanded: Розгорнутий блок
      card: Картка
    template:
      name: Шаблон цитати
      description: 'Налаштуйте формат цитати за допомогою змінних: {bibleRef}, {bibleRefLinked}, {quote}'
    preview:
      name: Попередній перегляд цитати
  offlineBible:
    name: Офлайн-Біблія
    description: Імпортуйте EPUB Біблії один раз і використовуйте локальні дані глав для офлайн-пошуку цитат.
    enabled:
      name: Увімкнути офлайн-Біблію
      description: Дозволити конвеєру цитат використовувати імпортовані локальні дані Біблії.
    preferOffline:
      name: Надавати перевагу офлайн-цитатам
      description: Спочатку перевіряти імпортовану офлайн-Біблію, перш ніж намагатися онлайн-пошук.
    allowOnlineFallback:
      name: Дозволити онлайн-резерв
      description: Якщо офлайн-даних немає, дозволити плагіну спробувати онлайн-провайдер цитат.
    installedList:
      name: Установлені офлайн-Біблії
      description: Для кожної мови можна встановити одну офлайн-Біблію. Мова визначається за метаданими EPUB.
      empty: Офлайн-Біблії ще не встановлено.
      entry: '{{sourceFileName}} — {{chapterCount}} глав, імпортовано {{importedAt}}'
    actions:
      name: Дії з офлайн-Біблією
      description: Імпортуйте EPUB, щоб додати нову мову. Щоб замінити наявну, спочатку видаліть її.
      import: Імпортувати EPUB Біблії
      importing: Імпортування...
      openFolder: Відкрити папку офлайн-Біблії
