settings:
  language:
    name: Språk
    description: Velg språk for bibelhenvisninger
  openAutomatically:
    name: Åpne lenker automatisk
    description: Flytter kommandoen «Opprett lenke og åpne» til toppen av listen
  updatedLinkStructure:
    name: Behold lenketekst
    description: Når dette er aktivert, beholdes gjeldende lenketekst ved konvertering av bibeltekst
    keepCurrentStructure: Behold gjeldende struktur
    usePluginSettings: Bruk plugin-innstillinger
  noLanguageParameter:
    name: Opprett lenker uavhengig av språk
    description: Når dette er aktivert, legges det ikke til noen språkparameter i lenken. Lenker åpnes på språket til JW Library
  reconvertExistingLinks:
    name: Konverter eksisterende lenker på nytt
    description: Når dette er aktivert, konverteres allerede konverterte jwlibrary://-lenker på nytt i henhold til gjeldende formateringsinnstillinger. Dette gjør det mulig å oppdatere alle lenker slik at de samsvarer med dine nyeste preferanser.
  bookLength:
    name: Lengde på lenketekst
    description: Velg lengde på lenketeksten
    short: Kort
    medium: Middels
    long: Lang
  linkStyling:
    name: Lenkestil
    description: Velg tegn eller emoji som skal legges til før, etter eller inne i lenken og velg skriftstil
    reset: 'Tilbakestill til standard: "{{default}}"'
    prefixOutsideLink:
      name: Prefiks utenfor lenke
      description: Tekst som legges til før lenken
    prefixInsideLink:
      name: Prefiks inni lenke
      description: Tekst som legges til i begynnelsen av lenketeksten
    suffixInsideLink:
      name: Suffiks inne i lenke
      description: Tekst som legges til på slutten av lenketeksten
    suffixOutsideLink:
      name: Suffiks utenfor lenke
      description: Tekst som legges til etter lenken
    presets:
      name: Stilforvalg
      description: Velg et forhåndsdefinert stilvalg for lenken
    fontStyle:
      name: Skriftstil
      description: Velg skriftstil for lenketeksten
      normal: Normal
      italic: Kursiv
      bold: Fet
    preview:
      name: Forhåndsvisning av lenke
  bibleQuote:
    name: Formatering av bibelsitat
    description: Angi hvordan bibelsitater skal formateres når de settes inn
    presets:
      name: Malforvalg
      short: Lenke + sitat
      plain: Lenke i sitat
      foldable: Sammenleggbar callout
      expanded: Utvidet callout
    template:
      name: Sitatmal
      description: 'Tilpass sitatformatet med variablene: {bibleRef}, {bibleRefLinked}, {quote}'
    preview:
      name: Forhåndsvisning av bibelsitat
  offlineBible:
    name: Offline bibel
    description: Importer en bibel-EPUB én gang, og bruk lokale kapitteldata for offline sitatoppslag.
    enabled:
      name: Aktiver offline bibel
      description: Tillat at sitatfunksjonen bruker importerte, lokale bibeldata.
    preferOffline:
      name: Foretrekk offline sitater
      description: Sjekk den importerte offline bibelen før det forsøkes å hente sitatet på nettet.
    allowOnlineFallback:
      name: Tillat online reserveløsning
      description: Hvis offline data mangler, tillat at pluginet forsøker den nettbaserte sitatkilden.
    installedList:
      name: Installerte offline bibler
      description: Én offline bibel kan installeres per språk. Språket registreres ut fra EPUB-metadataene.
      empty: Ingen offline bibler er installert ennå.
      entry: '{{sourceFileName}} — {{chapterCount}} kapitler, importert {{importedAt}}'
    actions:
      name: Handlinger for offline bibel
      description: Importer en EPUB for å legge til et nytt språk. For å erstatte en eksisterende må du fjerne den først.
      import: Importer bibel-EPUB
      importing: Importerer …
      openFolder: Åpne mappen for offline bibel
