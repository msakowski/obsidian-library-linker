name: Draft Release PR

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # Required for tagging the release
  pull-requests: write # Required for creating release PRs

jobs:
  draft-release:
    name: Draft Release PR
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.USER_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create changesets PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.USER_TOKEN }}
          pr-title: 🚀 Release new version
          version-script: pnpm run version
          publish-script: pnpm run release
          push-with-git-cli: true
          # The release script pushes version tags; release.yml creates GitHub releases.
          create-github-releases: false
          push-git-tags: false
        env:
          SKIP_SIMPLE_GIT_HOOKS: 1
